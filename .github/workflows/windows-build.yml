name: Build CalboniWins

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyautogui pyinstaller

      - name: Build CalboniWins.exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CalboniWins --icon calboni.ico calboni.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CalboniWins-Windows
          path: dist/CalboniWins.exe
          if-no-files-found: error